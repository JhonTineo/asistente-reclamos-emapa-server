version: '3.8'
services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./volumes/qdrant_storage:/qdrant/storage

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./volumes/ollama:/root/.ollama
  
  agent:
    build: 
      context: ./app
    container_name: sunass-agent
    restart: unless-stopped
    depends_on:
      - qdrant
      - ollama
    ports:
      - "8000:8000"
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./app:/app
