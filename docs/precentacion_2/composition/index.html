<script type="application/hyperframes-slideshow+json">
{
  "slides": [
    {
      "sceneId": "portada",
      "notes": "Buenas tardes. Les vamos a mostrar cómo atender un reclamo con Yumi en un intervalo de tres a cinco minutos, incluida la revisión y aprobación humana."
    },
    {
      "sceneId": "dolor",
      "notes": "Un reclamo toma de tres a cinco días desde que se realizaron las inspecciones. Hoy el especialista abre varias pestañas para resolver un reclamo, junta las pruebas a mano, busca la norma y redacta tres documentos por cada reclamo: informe de atención, propuesta de conciliación y resolución. Siguiente: pestañas. Siguiente: documentos.",
      "fragments": [
        6.3,
        6.55,
        6.8
      ]
    },
    {
      "sceneId": "riesgo",
      "notes": "El reglamento da 30 días hábiles. Si no se emite la resolución a tiempo, el reclamo se declara fundado por silencio administrativo, sin haber terminado la investigación. No es un problema de fondo: es de tiempo.",
      "fragments": [
        12.3,
        12.55
      ]
    },
    {
      "sceneId": "solucion",
      "notes": "Yumi prepara el expediente completo: informe de atención, propuesta de conciliación y resolución, exportables a Word. Y la persona revisa y aprueba.",
      "fragments": [
        18.3,
        18.55
      ]
    },
    {
      "sceneId": "recorrido",
      "notes": "El reclamo sigue cuatro etapas en el sistema central. Primero, se registra y se sigue su estado en el sistema comercial de la empresa. Segundo, el personal realiza las inspecciones e investiga los medios probatorios; Yumi analiza los medios aplicables y prepara el informe de atención. Tercero, Yumi prepara la propuesta de la empresa para la conciliación con base en la atención. Cuarto, redacta la resolución a partir de la atención y la conciliación. El personal revisa y registra los documentos en el sistema comercial de la empresa. El apoyo de Yumi al análisis y redacción toma de tres a cinco minutos con las inspecciones ya realizadas y revisión humana. Cada Siguiente avanza una etapa. Yumi se incorpora al sistema comercial que utilice la empresa.",
      "fragments": [
        24.3,
        24.55,
        24.8,
        25.05,
        25.3
      ]
    },
    {
      "sceneId": "medios",
      "notes": "Yumi analiza los medios probatorios aplicables al reclamo. La pantalla muestra ejemplos: tarjeta de lecturas, récord de facturación, cortes y reaperturas, saldo detalle e inspecciones interna y externa. No limita la investigación a esos ejemplos. Explica los hallazgos en lenguaje claro. Siguiente: análisis listo.",
      "fragments": [
        30.3,
        30.55
      ]
    },
    {
      "sceneId": "normativa",
      "notes": "Cada hallazgo se contrasta con el reglamento de SUNASS. El reglamento se corta en artículos y se guarda en una base vectorial. Con un hallazgo, Yumi recupera el artículo aplicable y lo cita. La resolución sale fundamentada, no de memoria.",
      "fragments": [
        36.3,
        36.55
      ]
    },
    {
      "sceneId": "corre",
      "notes": "Puede correr completamente en su servidor, con modelos locales, y los datos del reclamo no salen de la empresa. O con un proveedor en la nube. Si preguntan por la arquitectura: botón Ver arquitectura.",
      "fragments": [
        42.3,
        42.55
      ],
      "hotspots": [
        {
          "id": "h-arq",
          "label": "Ver arquitectura",
          "target": "seq-arquitectura",
          "region": {
            "x": 62,
            "y": 3,
            "w": 36,
            "h": 9
          }
        }
      ]
    },
    {
      "sceneId": "demo",
      "notes": "Demostración del flujo integrado, con cuatro etapas y diez pasos de navegación. Ingreso: SYSCO conserva los datos y el seguimiento del reclamo; las capturas disponibles son el detalle y listado de un reclamo registrado, no el formulario de alta inicial. Atención: el personal realiza las inspecciones y reúne las pruebas; Yumi define la investigación, analiza los medios aplicables y genera el informe de atención para revisión y registro en SYSCO. Conciliación: se muestran el listado, los datos y los campos de propuesta y acuerdos de SYSCO junto a la propuesta que Yumi prepara con base en la atención. Resolución: se muestran el listado, los antecedentes y el campo de resolución de SYSCO junto a la redacción que Yumi elabora con base en la atención y conciliación. El personal conduce la conciliación, revisa los documentos y registra los resultados. Las capturas de SYSCO y Yumi son referencias de distintos expedientes y no representan una transacción automática entre pantallas. El botón final abre Yumi en vivo.",
      "fragments": [
        48.3,
        48.55,
        48.8,
        49.05,
        49.3,
        49.55,
        49.8,
        50.05,
        50.3,
        50.55
      ]
    },
    {
      "sceneId": "piloto",
      "notes": "Proponemos empezar en paralelo, sin tocar su proceso, durante dos meses. Después, escribir directamente en su sistema comercial y, por último, automatizar los reclamos simples.",
      "fragments": [
        54.3,
        54.55,
        54.8
      ]
    },
    {
      "sceneId": "cierre",
      "notes": "Les proponemos algo concreto: tomamos 20 expedientes de su EPS y comparamos con lo que ustedes resolvieron. Gracias. El botón abre Yumi en vivo."
    }
  ],
  "slideSequences": [
    {
      "id": "seq-arquitectura",
      "label": "Arquitectura",
      "slides": [
        {
          "sceneId": "arquitectura",
          "notes": "Panel web en React, servicio en FastAPI, agentes, normativa en base vectorial, modelo local o en la nube y conexión al sistema comercial."
        }
      ]
    }
  ]
}
</script>
