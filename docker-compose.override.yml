# Solo para desarrollo LOCAL.
# docker compose lo combina automaticamente con docker-compose.yml al hacer
# `docker compose up`. Coolify NO lo usa (solo lee docker-compose.yml), asi que
# aqui publicamos los puertos al host para poder acceder desde localhost.
services:
  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"

  ollama:
    ports:
      - "11434:11434"
    # GPU NVIDIA (requiere el NVIDIA Container Toolkit / Docker Desktop con WSL2).
    # Sin esto los embeddings corren en CPU y indexar una norma tarda minutos.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  agent:
    ports:
      - "8000:8000"
    # Hot-reload: monta el codigo local sobre el de la imagen. NO va en
    # docker-compose.yml porque Coolify borra los artefactos tras el build y
    # el mount taparia el codigo con una carpeta vacia (crash del contenedor).
    volumes:
      - ./app:/code/app
